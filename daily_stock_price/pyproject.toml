[project]
name = "daily-stock-price"
version = "0.1.0"
description = "A high-compression stock price database with incremental updates and 3-day overwrite logic."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yfinance>=0.2.54",
    "duckdb>=1.2.1",
    "pandas>=2.2.3",
    "pyarrow>=19.0.1",
    "zstandard>=0.23.0",
    "pytest>=9.0.3",
    "requests>=2.32.3",
    "xlrd>=2.0.1",
    "openpyxl>=3.1.5",
    "lxml>=5.3.1",
    "setuptools",
    "fastapi>=0.115.0",
    "uvicorn>=0.31.0",
    "ruff>=0.6.4",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "python-semantic-release>=9.8.3",
    "loguru>=0.7.3",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.semantic_release]
version_variable = "pyproject.toml:version"
branch = "add-catalog"
upload_to_pypi = false
upload_to_release = true
build_command = "uv build"

[tool.semantic_release.changelog]
exclude_commit_patterns = ["chore:", "test:"]

[tool.semantic_release.branches.main]
match = "(main|add-catalog)"
