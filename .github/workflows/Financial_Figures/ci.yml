name: CI/CD Automation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  branch-guard:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - name: Enforcement Check
        run: |
          echo "ERROR: Direct push to protected branch detected!"
          echo "Process Violation: Changes to 'main' or 'develop' must be via Pull Request."
          # We check if the commit was a merge commit (typically 2 parents)
          # A direct push usually has 1 parent.
          PARENT_COUNT=$(git show -s --format=%P ${{ github.sha }} | wc -w)
          if [ "$PARENT_COUNT" -le 1 ]; then
            echo "::error::Direct push is FORBIDDEN. Please revert and use a Pull Request."
            exit 1
          fi

  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-mock
          pip install -e .
          
      - name: Run Ruff Check (Lint)
        run: ruff check .
        
      - name: Run Ruff Format Check
        run: ruff format --check .
        
      - name: Run Tests
        run: |
          # Create a dummy .env if needed for tests, or use environment variables
          export GEMINI_API_KEY="dummy"
          pytest -vv

  release:
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Python Semantic Release
        uses: python-semantic-release/python-semantic-release@v8.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
