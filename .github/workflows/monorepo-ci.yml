name: CI / Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  python-tests:
    name: Test Python - ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: 
          - "Financial Figures"
          - "daily_stock_price"
          - "asset management App"
          - "macro"
          - "index"
          - "daily_crypto_price"
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "${{ matrix.module }}/.python-version"
      
      - name: Install dependencies
        run: |
          cd "${{ matrix.module }}"
          uv sync
      
      - name: Run Ruff Check
        run: |
          cd "${{ matrix.module }}"
          uv run ruff check .
      
      - name: Run Pytest
        run: |
          cd "${{ matrix.module }}"
          # Skip if no tests directory exists
          if [ -d "tests" ]; then
            uv run pytest tests
          else
            echo "No tests directory found, skipping pytest."
          fi

  frontend-build:
    name: Build Frontend - Asset App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'asset management App/src/frontend/package-lock.json'
      
      - name: Install dependencies
        run: |
          cd "asset management App/src/frontend"
          npm ci
      
      - name: Lint and Build
        run: |
          cd "asset management App/src/frontend"
          npm run lint
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # Final status check job that depends on all matrix jobs
  # This is the one we use for the Branch Ruleset
  final-status:
    name: CI / Build
    needs: [python-tests, frontend-build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check overall status
        run: |
          if [[ "${{ needs.python-tests.result }}" == "success" && "${{ needs.frontend-build.result }}" == "success" ]]; then
            echo "All tests passed!"
            exit 0
          else
            echo "One or more tests failed."
            exit 1
          fi
