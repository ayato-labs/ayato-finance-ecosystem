name: CI / Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  changes:
    name: Check for Changes
    runs-on: ubuntu-latest
    outputs:
      daily_stock_price: ${{ steps.filter.outputs.daily_stock_price }}
      daily_crypto_price: ${{ steps.filter.outputs.daily_crypto_price }}
      financial_figures: ${{ steps.filter.outputs.financial_figures }}
      financial_narratives: ${{ steps.filter.outputs.financial_narratives }}
      asset_app: ${{ steps.filter.outputs.asset_app }}
      forex: ${{ steps.filter.outputs.forex }}
      index: ${{ steps.filter.outputs.index }}
      macro: ${{ steps.filter.outputs.macro }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            daily_stock_price: 'daily_stock_price/**'
            daily_crypto_price: 'daily_crypto_price/**'
            financial_figures: 'Financial Figures/**'
            financial_narratives: 'Financial Narratives/**'
            asset_app: 'asset management App/**'
            forex: 'forex/**'
            index: 'index/**'
            macro: 'macro/**'
            frontend: 'asset management App/src/frontend/**'

  python-ci:
    needs: changes
    name: CI - ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: "daily_stock_price"
            id: daily_stock_price
          - module: "daily_crypto_price"
            id: daily_crypto_price
          - module: "Financial Figures"
            id: financial_figures
          - module: "Financial Narratives"
            id: financial_narratives
          - module: "asset management App"
            id: asset_app
          - module: "forex"
            id: forex
          - module: "index"
            id: index
          - module: "macro"
            id: macro
    if: ${{ needs.changes.outputs[matrix.id] == 'true' }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      
      - name: Install dependencies
        run: |
          cd "${{ matrix.module }}"
          uv sync
      
      - name: Run Ruff Check
        run: |
          cd "${{ matrix.module }}"
          uv run ruff check .
      
      - name: Run Pytest
        run: |
          cd "${{ matrix.module }}"
          if [ -d "tests" ]; then
            uv run pytest tests
          else
            echo "No tests directory found, skipping pytest."
          fi

  frontend-ci:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    name: CI - Asset App Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'asset management App/src/frontend/package-lock.json'
      - name: Install dependencies
        run: |
          cd "asset management App/src/frontend"
          npm ci
      - name: Lint and Build
        run: |
          cd "asset management App/src/frontend"
          npm run lint
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  gatekeeper:
    name: CI / Build
    needs: [python-ci, frontend-ci]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check overall status
        run: |
          # Job result can be 'success', 'failure', 'cancelled', or 'skipped'
          # We treat 'success' and 'skipped' as passing for the monorepo logic
          PYTHON_RES="${{ needs.python-ci.result }}"
          FRONTEND_RES="${{ needs.frontend-ci.result }}"
          
          if [[ ($PYTHON_RES == "success" || $PYTHON_RES == "skipped") && ($FRONTEND_RES == "success" || $FRONTEND_RES == "skipped") ]]; then
            echo "CI Passed."
            exit 0
          else
            echo "CI Failed. Python: $PYTHON_RES, Frontend: $FRONTEND_RES"
            exit 1
          fi
