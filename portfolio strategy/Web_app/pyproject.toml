[project]
name = "portfolio-rebalancer-web"
version = "0.1.0"
description = "A stateless portfolio rebalancing tool (Web/PWA)"
authors = [
    { name = "ayato-labs", email = "ayato-labs@example.com" }
]
dependencies = [
    "loguru>=0.7.0"
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "node_modules",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "C90", "B"]
ignore = []
