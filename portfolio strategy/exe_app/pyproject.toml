[project]
name = "portfolio-rebalancer"
version = "0.1.0"
description = "A stateless portfolio rebalancing tool"
authors = [
    { name = "ayato-labs", email = "ayato-labs@example.com" }
]
dependencies = [
    "loguru>=0.7.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "node_modules",
    "dist",
    "dist_electron",
    "dist_package",
    "electron",
    "logs",
    "mobile-alloc",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "C90", "B"]
ignore = []
