[project]
name = "edgar-provider"
version = "0.1.0"
description = "EDGAR Provider Ingestion Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "edgar-core",
    "edgartools>=3.0.0",
    "pandas>=2.2.0",
    "zstandard>=0.23.0",
    "tenacity>=9.0.0",
    "requests>=2.33.1",
    "pyarrow",
]

[tool.uv.sources]
edgar-core = { workspace = true }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
