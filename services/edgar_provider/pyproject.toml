[project]
name = "edgar_provider"
version = "0.1.0"
description = "SEC EDGAR Data Provider"
authors = [
    { name = "ayato-labs", email = "ayato-labs@example.com" }
]
dependencies = [
    "requests",
    "beautifulsoup4",
    "duckdb",
    "loguru",
    "markdownify",
    "lxml",
    "edgartools",
    "pandas",
]

[project.scripts]
edgar-provider = "edgar_provider.cli:main"

[tool.setuptools.package-dir]
"edgar_core" = "libs/core/src/edgar_core"
"edgar_provider" = "apps/provider/src/edgar_provider"

[tool.setuptools.packages.find]
where = ["libs/core/src", "apps/provider/src"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
