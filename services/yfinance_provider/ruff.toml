line-length = 100
target-version = "py312"
src = ["src", "tests"]

[lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "PL", "RUF"]
ignore = [
    "PLR0913",
    "PLR0912",
    "PLR0915",
    "PLR2004",
    "PLC0415",
    "E402",
    "RUF001",
    "RUF002",
    "RUF003",
    "E501",
]

[lint.per-file-ignores]
"scripts/**/*" = ["T201", "C901", "PLR0912", "PLR0915"]
"scratch/**/*" = ["T201", "C901", "PLR0912", "PLR0915"]
"tests/**/*" = ["T201"]

[format]
quote-style = "double"
indent-style = "space"
