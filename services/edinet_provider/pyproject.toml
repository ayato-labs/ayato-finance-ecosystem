[project]
name = "edinet-provider"
version = "0.1.0"
description = "Japanese Market data provider using EDINET API v2"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "edinet-tools>=0.1.0",
    "duckdb>=1.1.0",
    "pandas>=2.2.0",
    "pydantic-settings>=2.4.0",
    "loguru>=0.7.2",
    "zstandard>=0.23.0",
    "fastapi>=0.112.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.1",
    "beautifulsoup4>=4.12.0",
    "requests>=2.32.0",
    "edinet-mcp",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
exclude = [
    "data",
    "logs",
    "scratch",
    ".venv",
    ".git",
    "__pycache__",
    "docs",
    "migrations",
    "tmp",
    "artifacts"
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "PL",  # pylint
    "RUF", # ruff-specific rules
    "TID", # flake8-tidy-imports
]
ignore = [
    "PLR0913", # Too many arguments
    "PLR2004", # Magic value used in comparison
]
# Ensure no auto-fix is used by the tool itself during check
fixable = []
unfixable = ["ALL"]

[tool.uv.sources]
edinet-mcp = { git = "https://github.com/ajtgjmdjp/edinet-mcp.git" }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.12",
]
