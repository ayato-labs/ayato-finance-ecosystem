[project]
name = "daily_crypto_price"
version = "0.1.0"
description = "Decoupled Daily Crypto Price API"
dependencies = [
    "fastapi",
    "uvicorn",
    "yfinance",
    "pandas",
    "duckdb",
    "loguru",
    "tenacity>=9.1.4",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "PL", "RUF"]
ignore = [
    "PLR0913",
    "PLR0912",
    "PLR0915",
    "PLR2004",
    "PLC0415",
    "E402",
    "RUF001",
    "RUF002",
    "RUF003",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*" = ["T201", "C901", "PLR0912", "PLR0915"]
"scratch/**/*" = ["T201", "C901", "PLR0912", "PLR0915"]
"tests/**/*" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

