[project]
name = "forex"
version = "0.1.0"
description = "Forex Service for Ayato Finance Ecosystem"
dependencies = [
    "fastapi",
    "uvicorn",
    "yfinance",
    "pandas",
    "duckdb",
    "pyarrow",
    "python-dotenv",
    "coloredlogs",
    "loguru>=0.7.3",
    "tenacity>=9.1.4",
]

[tool.uv]
dev-dependencies = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "PL", "RUF"]
ignore = ["PLR0913", "PLR0912", "PLR0915", "PLR2004", "PLC0415", "E402", "RUF001", "RUF002", "RUF003"]
