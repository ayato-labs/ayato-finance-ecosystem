[project]
name = "index"
version = "0.1.0"
description = "Market Index and Macro Economic Indicators Database API"
authors = [
    { name = "ayato-labs" }
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "duckdb>=0.9.2",
    "pandas>=2.2.0",
    "yfinance>=0.2.36",
    "pyarrow>=15.0.0",
    "httpx>=0.26.0",
    "pydantic-settings>=2.1.0",
    "coloredlogs>=15.0.1",
    "loguru>=0.7.3",
]
readme = "README.md"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.2.1",
    "pytest-cov>=4.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B"]
ignore = ["PLR0913", "PLR0912", "PLR0915", "PLR2004", "PLC0415", "E402", "RUF001", "RUF002", "RUF003"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
