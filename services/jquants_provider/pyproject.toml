[project]
name = "jquants-provider"
version = "0.1.0"
description = "Standalone J-Quants data provider service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0.0",
    "httpx>=0.27.0",
    "pandas>=2.0.0",
    "pydantic-settings>=2.0.0",
    "tenacity>=8.0.0",
    "jquants-api-client>=0.2.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "loguru>=0.7.3",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
