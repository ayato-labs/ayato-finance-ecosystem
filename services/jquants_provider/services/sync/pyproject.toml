[project]
name = "jquants-sync"
version = "0.1.0"
description = "J-Quants Data Synchronization Engine"
dependencies = [
    "duckdb>=0.9.2",
    "pandas>=2.1.0",
    "pydantic>=2.4.0",
    "loguru>=0.7.2",
    "jquants-api-client>=1.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["core", "engine"]
