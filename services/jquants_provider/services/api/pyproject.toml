[project]
name = "jquants-api"
version = "0.1.0"
description = "J-Quants Data Access API"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "duckdb>=0.9.2",
    "pydantic>=2.4.0",
    "loguru>=0.7.2",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["core"]
