[project]
name = "financial-figures"
version = "0.1.0"
description = "Local financial time-series database with AI-driven semantic mapping"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0.0",
    "httpx>=0.27.0",
    "pandas>=2.0.0",
    "pydantic-settings>=2.0.0",
    "tenacity>=8.0.0",
    "google-genai>=0.1.0",
    "jquants-api-client>=0.2.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "coloredlogs>=15.0.1",
    "pyarrow>=15.0.1",
    "loguru>=0.7.3",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "PL", "RUF", "S"]
ignore = ["PLR0913", "PLR0912", "PLR0915", "PLR2004", "PLC0415", "E402", "RUF001", "RUF002", "RUF003"] # Allow complex financial functions and AI mapping logic

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"scratch/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.python_semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
upload_to_pypi = false
upload_to_release = true
build_command = "pip install build && python -m build"
