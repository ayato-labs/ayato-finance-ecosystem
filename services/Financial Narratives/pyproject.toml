[project]
name = "financial-narratives"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "duckdb>=1.1.3",
    "google-genai>=1.73.1",
    "pandas>=2.2.3",
    "psutil>=6.1.1",
    "loguru>=0.7.3",
    "lxml>=6.1.0",
    "markdownify>=0.14.1",
    "requests>=2.33.1",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.2",
    "pytest>=8.3.4",
    "pytest-mock>=3.14.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.9.4",
    "python-dotenv>=1.2.2",
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "PL", "RUF"]
ignore = [
    "PLR0913",
    "PLR0912",
    "PLR0915",
    "PLR2004",
    "PLC0415",
    "E402",
    "RUF001",
    "RUF002",
    "RUF003",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*" = ["T201", "C901", "PLR0912", "PLR0915"]
"scratch/**/*" = ["T201", "C901", "PLR0912", "PLR0915"]
"tests/**/*" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
