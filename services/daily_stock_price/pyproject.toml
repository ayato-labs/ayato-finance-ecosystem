[project]
name = "daily-stock-price"
version = "0.1.0"
description = "A high-compression stock price database with incremental updates and 3-day overwrite logic."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "yfinance>=0.2.54",
    "duckdb>=1.2.1",
    "pandas>=2.2.3",
    "pyarrow>=19.0.1",
    "zstandard>=0.23.0",
    "pytest>=9.0.3",
    "requests>=2.32.3",
    "xlrd>=2.0.1",
    "openpyxl>=3.1.5",
    "lxml>=5.3.1",
    "setuptools",
    "fastapi>=0.115.0",
    "uvicorn>=0.31.0",
    "ruff>=0.6.4",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "python-semantic-release>=9.8.3",
    "loguru>=0.7.3",
    "tenacity>=9.1.4",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Target only src and tests for major logic checks
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "PL", "RUF"]
ignore = [
    "PLR0913", # Too many arguments
    "PLR0912", # Too many branches
    "PLR0915", # Too many statements
    "PLR2004", # Magic value used in comparison
    "PLC0415", # Import should be at top of file
    "E402",    # Module level import not at top of file
    "RUF001",  # String contains ambiguous unicode character
    "RUF002", 
    "RUF003",
    "E501",    # Line too long (handled by formatter, but sometimes we want to ignore)
]

[tool.ruff.lint.per-file-ignores]
# Ignore print and complexity for scripts and scratch files
"scripts/**/*" = ["T201", "C901", "PLR0912", "PLR0915"]
"scratch/**/*" = ["T201", "C901", "PLR0912", "PLR0915"]
# Allow print in tests
"tests/**/*" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.semantic_release]
version_variable = "pyproject.toml:version"
branch = "add-catalog"
upload_to_pypi = false
upload_to_release = true
build_command = "uv build"

[tool.semantic_release.changelog]
exclude_commit_patterns = ["chore:", "test:"]

[tool.semantic_release.branches.main]
match = "(main|add-catalog)"
